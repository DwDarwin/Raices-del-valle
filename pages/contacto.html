<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Contáctanos: dudas sobre tu pedido o suma tu finca a la red de Raíces del Valle.">
    <title>Contacto | Raíces del Valle</title>

    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%23102e22'/%3E%3Cpath d='M10 22c0-7 5-12 12-12 0 7-5 12-12 12zm0 0l7-7' stroke='%23f6f1e7' stroke-width='1.6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/styles.css">
    <script type="module" src="../js/app.js"></script>
</head>

<body>
    <header id="header-container"></header>

    <!-- CONTENIDO -->
    <main class="contact-section">
        <div class="contact-grid">

            <section class="contact-info" aria-labelledby="tituloContacto">
                <h4 class="subtitle eyebrow">Estamos cerca</h4>
                <h1 id="tituloContacto" class="banner-title contact-title">Conversemos.</h1>
                <p class="contact-lead">¿Tienes dudas sobre tu pedido o quieres sumar tu finca a esta red? Escríbenos y
                    te responderemos pronto.</p>

                <hr class="divider">

                <ul class="info-list">
                    <li>
                        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 21s-7-6.5-7-12a7 7 0 0 1 14 0c0 5.5-7 12-7 12z" fill="none" stroke="currentColor" stroke-width="1.6" /><circle cx="12" cy="9" r="2.5" fill="none" stroke="currentColor" stroke-width="1.6" /></svg>
                        <div><span class="info-label">Visítanos</span>Tamabioy, Putumayo</div>
                    </li>
                    <li>
                        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.6" /><path d="M12 7v5l3 2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" /></svg>
                        <div><span class="info-label">Horario</span>Lunes a sábado<br>8:00 a. m. — 5:00 p. m.</div>
                    </li>
                </ul>
            </section>

            <section class="contact-form-wrap" aria-label="Formulario de contacto">
                <div class="form-card">
                    <form id="formContacto" action="https://formspree.io/f/maeqagwj" method="POST" novalidate>
                        <div class="form-grid">

                            <div class="field">
                                <label for="nombre">Nombre completo</label>
                                <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" autocomplete="name" maxlength="60" aria-describedby="nombreError">
                                <div id="nombreError" class="field-error"></div>
                            </div>

                            <div class="field">
                                <label for="correo">Correo electrónico</label>
                                <input type="email" id="correo" name="email" placeholder="tu@correo.com" autocomplete="email" maxlength="100" aria-describedby="correoError">
                                <div id="correoError" class="field-error"></div>
                            </div>

                            <div class="field">
                                <label for="telefono">Teléfono</label>
                                <input type="tel" id="telefono" name="telefono" placeholder="300 123 4567" autocomplete="tel" inputmode="tel" maxlength="17" aria-describedby="telefonoError">
                                <div id="telefonoError" class="field-error"></div>
                            </div>

                            <div class="field">
                                <label for="motivo">¿Cómo podemos ayudarte?</label>
                                <select id="motivo" name="motivo" aria-describedby="motivoError">
                                    <option value="" selected>Selecciona una opción</option>
                                    <option value="pedido">Tengo una duda sobre mi pedido</option>
                                    <option value="finca">Quiero sumar mi finca a la red</option>
                                    <option value="mayorista">Compras al por mayor</option>
                                    <option value="otro">Otro tema</option>
                                </select>
                                <div id="motivoError" class="field-error"></div>
                            </div>

                            <div class="field field-full">
                                <label for="mensaje">Mensaje</label>
                                <textarea id="mensaje" name="mensaje" rows="4" placeholder="Cuéntanos un poco más..." maxlength="500" aria-describedby="mensajeError mensajeContador"></textarea>
                                <div class="field-foot">
                                    <div id="mensajeError" class="field-error"></div>
                                    <small id="mensajeContador" class="char-counter">0 / 500</small>
                                </div>
                            </div>

                            <!-- Campo trampa contra spam (Formspree lo ignora si está vacío) -->
                            <div class="honeypot" aria-hidden="true">
                                <label for="gotcha">No llenar</label>
                                <input type="text" id="gotcha" name="_gotcha" tabindex="-1" autocomplete="off">
                            </div>

                            <div class="field-full">
                                <button type="submit" class="btn btn-primary btn-submit" id="btnEnviar">
                                    <span class="btn-text">Enviar mensaje</span>
                                    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 12h14m-5-5l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></svg>
                                </button>
                            </div>
                        </div>

                        <div id="formEstado" class="form-status" role="status" aria-live="polite"></div>
                    </form>
                </div>
            </section>

        </div>
    </main>

    <footer id="footer-container"></footer>

</body>

</html>
