<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Conexion boxicons -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>


    <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet" href="../css/styles.css">

    <title>login</title>
</head>


<body>
    <main class="contenedorlogin">
        <section class="banner-izq">
            <div class="brand">
                <div class="brand-mark light">
                    <i class='bx bx-leaf bx-sm'></i>
                </div>
                <div class="brand-text light">
                    Raíces
                    <small>del Valle</small>
                </div>
            </div>
            <div class="banner-imagen">
                <blockquote>
                    "Cuando conoces el origen cada alimento sabe mejor."
                </blockquote>
                <span class="text-peq">VALLE DE SIBUNDOY - PUTUMAYO</span>
            </div>

        </section>



        <section class="formulario-der">
            <a href="../index.html" class="btnx" aria-label="cerrar">X</a>

            <div class="linea">
                <span class="linea-text-peq"></span>
                <span class="text-peq-der">QUE BUENO VERTE</span>
            </div>

            <h1>Bienvenido de nuevo.</h1>
            <span class="text-peq2-der">Ingresa para seguir tus pedidos y guardar tus productos favoritos</span>

            <div class="formulario">

                <form action="email">

                    <label id="email1" for="email">correo electronico</label>

                    <div class="email1">
                        <input id="email" type="email" placeholder="Tunombre@correo.com">
                    </div>

                </form>
                <form action="password">
                    <div class="label-wrapper">
                        <label id="password1" for="password">Contraseña</label>
                        <a href="#" class="forgot-link">¿La olvidaste?</a>
                    </div>  

                    <div class="password1 password-wrapper">
                        <input type="password" id="Contrasena" placeholder="Mínimo 8 caracteres">
                        <button type="button" id="ojo" class="eye-btn">👁️</button>
                    </div>
                </form>

                <button type="submit" class="btn btn-primary btn-submit" id="btnEnviar">
                    <span class="btn-text">Ingresar a mi cuenta</span>
                    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                        <path d="M5 12h14m-5-5l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.8"
                            stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </button>
            </div>
            <div class="divider">
                <span>o continúa con</span>
            </div>

            <button class="btn btn-google">
                <i class='bx bxl-google' style='color:#ea4335'></i> Continuar con Google
            </button>

            <p class="register-prompt">
                ¿Aún no tienes cuenta? <a href="/Raices-del-valle/pages/registroUser.html">Regístrate gratis</a>
            </p>
        </section>




    </main>




    <script src="../js/login.js"></script>
</body>

</html>
